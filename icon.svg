<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E86A8"/>
      <stop offset="1" stop-color="#123E50"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EEF3F6"/>
    </linearGradient>
    <linearGradient id="chk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A8DB5"/>
      <stop offset="1" stop-color="#16506A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#04141c" flood-opacity="0.35"/>
    </filter>
    <clipPath id="cardclip"><rect x="252" y="246" width="520" height="560" rx="96"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- カレンダー -->
  <g filter="url(#shadow)">
    <rect x="252" y="246" width="520" height="560" rx="96" fill="url(#paper)"/>
  </g>
  <g clip-path="url(#cardclip)">
    <rect x="252" y="246" width="520" height="150" fill="url(#band)"/>
    <rect x="252" y="392" width="520" height="8" fill="#000" opacity="0.06"/>
  </g>
  <!-- リング -->
  <rect x="362" y="200" width="56" height="120" rx="28" fill="#0F3646"/>
  <rect x="606" y="200" width="56" height="120" rx="28" fill="#0F3646"/>
  <rect x="374" y="210" width="32" height="60" rx="16" fill="#ffffff" opacity="0.18"/>
  <rect x="618" y="210" width="32" height="60" rx="16" fill="#ffffff" opacity="0.18"/>

  <!-- チェック -->
  <path d="M384 590 L474 678 L648 498" fill="none" stroke="url(#chk)" stroke-width="76"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
